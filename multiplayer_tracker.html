
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Light The Star</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #090d12;
      color: #edf2f7;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #26313d;
    }

    h1 {
      font-size: 18px;
      margin: 0;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }

    .camera-view {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #030609;
      border: 1px solid #354352;
      border-radius: 12px;
      overflow: hidden;
      touch-action: manipulation;
      cursor: crosshair;
    }

    video { display: none; }

    canvas#canvasOutput {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .crosshair {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid #6000fb;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
    }

    .crosshair::before {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      background: #0bf4ec;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .coordinates {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #0bf4ec;
      font-size: 13px;
      font-family: monospace;
      line-height: 1.8;
      border: 1px solid #26313d;
      border-radius: 6px;
      pointer-events: none;
      z-index: 3;
    }

    .controls {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #0bf4ec;
      color: #10241a;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #354352;
      color: #888;
      cursor: not-allowed;
    }

    button:active:not(:disabled) {
      opacity: 0.8;
    }

    #status {
      color: #9eacbd;
      font-size: 13px;
      margin-top: 12px;
      line-height: 1.6;
    }

    .hint {
      color: #9eacbd;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 10px;
    }
  </style>

  <script
    async
    src="https://docs.opencv.org/4.x/opencv.js"
    onload="onOpenCvReady();">
  </script>
</head>

<body>
  <header>
    <h1>✳ NIGHT SKY TRACKER</h1>
  </header>

  <main>
    <div class="camera-view" id="cameraView">
      <video id="camera" autoplay playsinline muted></video>
      <canvas id="canvasOutput"></canvas>

      <div class="crosshair"></div>

      <div class="coordinates">
        Target Selected:
        <span id="detectedStatus" style="color: #ff4d4d;">NO</span>
        <br>
        X: <span id="coordX">0.00</span>
        <br>
        Y: <span id="coordY">0.00</span>
      </div>
    </div>

    <div class="controls">
      <button id="startCamera" disabled>
        กำลังโหลด OpenCV.js...
      </button>
      <div id="playerInfo" style="color:#0bf4ec;font-size:13px;text-align:center;">Player: กำลังเชื่อมต่อ...</div>
      <button id="runAnimation" style="display:none;background:#ffcf5a;color:#231900;">✨ รันอนิเมชันกลุ่มดาว</button>
    </div>

    <div id="status">สถานะ: รอโหลด OpenCV.js</div>

    <div class="hint">
      * กรอบสีส้มคือรูปทรงสี่เหลี่ยมที่ตรวจพบ<br>
      * แตะภายในกรอบที่ต้องการเลือก กรอบจะเปลี่ยนเป็นสีเขียวอมฟ้า<br>
      * X/Y คือพิกัดจุดเล็งกลางภาพภายในกรอบที่เลือก มีค่าระหว่าง 0.00–1.00
    </div>
  </main>

  <script>
    const camera = document.getElementById("camera");
    const canvasOutput = document.getElementById("canvasOutput");
    const cameraView = document.getElementById("cameraView");
    const button = document.getElementById("startCamera");
    const status = document.getElementById("status");
    const coordX = document.getElementById("coordX");
    const coordY = document.getElementById("coordY");
    const detectedStatus = document.getElementById("detectedStatus");
    const ctx = canvasOutput.getContext("2d");

    let stream = null;
    let isOpenCvReady = false;
    let isProcessing = false;

    let selectedPoint = null;
    let selectedQuad = null;

    // ล็อกเป้าหมายจนกว่าจะรีเฟรชเว็บ
    let targetLocked = false;

    let lostFrames = 0;
    let previousQuadCenter = null;
    let lastGoodXY = { x: 0, y: 0 };
    let smoothedXY = null;

    // รอค้นหากรอบเดิมต่อ ไม่ปลดล็อกเป้าหมายเอง
    const MAX_LOST_FRAMES = 90;
    const MIN_AREA_RATIO = 0.005;
    const MAX_AREA_RATIO = 0.95;

    // ปรับความสมูทของพิกัด X/Y
    // ค่ายิ่งต่ำยิ่งนิ่ง แต่ตอบสนองช้าลง
    const XY_SMOOTHING_ALPHA = 0.18;

    // ตัดการเปลี่ยนแปลงเล็กมากที่เกิดจาก noise
    const XY_DEADBAND = 0.0015;

    // เตรียม OpenCV.js
    function onOpenCvReady() {
      if (typeof cv === "undefined") {
        status.textContent =
          "โหลด OpenCV.js ไม่สำเร็จ ลองรีเฟรชหน้าเว็บ";
        return;
      }

      cv.onRuntimeInitialized = () => {
        isOpenCvReady = true;
        status.textContent =
          "สถานะ: OpenCV.js พร้อมทำงาน กดเปิดกล้องได้เลย";
        button.textContent = "เปิดกล้องส่องหา";
        button.disabled = false;
      };

      if (cv.Mat) {
        isOpenCvReady = true;
        status.textContent =
          "สถานะ: OpenCV.js พร้อมทำงาน กดเปิดกล้องได้เลย";
        button.textContent = "เปิดกล้องส่องหา";
        button.disabled = false;
      }
    }

    function setTargetStatus(found) {
      detectedStatus.textContent = found ? "YES" : "NO";
      detectedStatus.style.color =
        found ? "#0bf4ec" : "#ff4d4d";
    }

    function displayCoordinates(x, y, found) {
      coordX.textContent = Number(x).toFixed(2);
      coordY.textContent = Number(y).toFixed(2);
      setTargetStatus(found);
    }

    // WebSocket → Node.js → OSC → TouchDesigner
    // Cloudflare Tunnel hostname ต้อง forward ไปยัง server.js port 8080
    const WS_ENDPOINT = "ws://localhost:8080";
    const playerInfo = document.getElementById("playerInfo");
    const runAnimationButton = document.getElementById("runAnimation");
    let socket = null;
    let playerId = null;
    let lastXYSendTime = 0;
    let constellationComplete = false;

    function connectWebSocket() {
      if (socket && [WebSocket.OPEN, WebSocket.CONNECTING].includes(socket.readyState)) return;
      socket = new WebSocket(WS_ENDPOINT);
      socket.addEventListener("open", () => {
        playerInfo.textContent = "เชื่อมต่อแล้ว กำลังรับ Player ID...";
      });
      socket.addEventListener("message", (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "welcome") {
            playerId = data.playerId;
            playerInfo.textContent = `Player ${playerId} / เชื่อมต่อแล้ว`;
            if (stream) sendPlayerActive(true);
          } else if (data.type === "error") {
            playerInfo.textContent = data.message || "Server error";
          }
        } catch (e) { console.warn("WebSocket message parse error", e); }
      });
      socket.addEventListener("close", () => {
        playerId = null;
        playerInfo.textContent = "เชื่อมต่อหลุด กำลัง reconnect...";
        setTimeout(connectWebSocket, 1500);
      });
      socket.addEventListener("error", () => {
        playerInfo.textContent = "WebSocket เชื่อมต่อไม่สำเร็จ";
      });
    }

    function wsSend(data) {
      if (socket?.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(data));
        return true;
      }
      return false;
    }
    function sendPlayerActive(active) {
      wsSend({ type: "active", active: Boolean(active) });
    }
    function sendXYToTouchDesigner(x, y) {
      const now = performance.now();
      if (now - lastXYSendTime < 50) return;
      lastXYSendTime = now;
      wsSend({
        type: "xy",
        x: Math.max(0, Math.min(1, Number(x))),
        y: Math.max(0, Math.min(1, Number(y)))
      });
    }

    // เมื่อโค้ดตรวจดาวพบครบทุกดวง ให้เรียก markConstellationComplete()
    function markConstellationComplete() {
      constellationComplete = true;
      runAnimationButton.style.display = "block";
      runAnimationButton.disabled = false;
      status.textContent = "กลุ่มดาวครบแล้ว! กดปุ่มเพื่อรันอนิเมชัน";
    }
    runAnimationButton.addEventListener("click", () => {
      if (!constellationComplete) return;
      if (!wsSend({ type: "runAnimation" })) {
        status.textContent = "ยังไม่เชื่อมต่อเซิร์ฟเวอร์ จึงส่งคำสั่งไม่ได้";
        return;
      }
      status.textContent = "ส่งคำสั่งรันอนิเมชันไป TouchDesigner แล้ว";
    });

    connectWebSocket();

    // แปลงตำแหน่งที่แตะบนจอเป็นพิกัดจริงของภาพกล้อง
    function pointerToFrame(clientX, clientY) {
      if (!canvasOutput.width || !canvasOutput.height) {
        return null;
      }

      const rect = canvasOutput.getBoundingClientRect();

      const scale = Math.min(
        rect.width / canvasOutput.width,
        rect.height / canvasOutput.height
      );

      const shownWidth = canvasOutput.width * scale;
      const shownHeight = canvasOutput.height * scale;

      const offsetX = (rect.width - shownWidth) / 2;
      const offsetY = (rect.height - shownHeight) / 2;

      const x = (clientX - rect.left - offsetX) / scale;
      const y = (clientY - rect.top - offsetY) / scale;

      if (
        x < 0 || y < 0 ||
        x > canvasOutput.width ||
        y > canvasOutput.height
      ) {
        return null;
      }

      return { x, y };
    }

    cameraView.addEventListener("pointerdown", (event) => {
      // เลือกเป้าหมายได้เพียงครั้งเดียวต่อการโหลดเว็บ
      if (targetLocked) return;

      const point = pointerToFrame(
        event.clientX,
        event.clientY
      );

      if (point) {
        selectedPoint = point;
        status.textContent =
          "เลือกตำแหน่งแล้ว กำลังค้นหากรอบที่แตะ...";
      }
    });

    // ตรวจว่าจุดที่แตะอยู่ภายในรูปสี่เหลี่ยมหรือไม่
    function polygonContainsPoint(point, quad) {
      let inside = false;

      for (
        let i = 0, j = quad.length - 1;
        i < quad.length;
        j = i++
      ) {
        const xi = quad[i].x;
        const yi = quad[i].y;
        const xj = quad[j].x;
        const yj = quad[j].y;

        const intersects =
          ((yi > point.y) !== (yj > point.y)) &&
          (
            point.x <
            (xj - xi) * (point.y - yi) /
            ((yj - yi) || 1e-9) + xi
          );

        if (intersects) inside = !inside;
      }

      return inside;
    }

    function polygonArea(points) {
      let area = 0;

      for (let i = 0; i < points.length; i++) {
        const a = points[i];
        const b = points[(i + 1) % points.length];

        area += a.x * b.y - b.x * a.y;
      }

      return Math.abs(area / 2);
    }

    function centerOf(points) {
      return {
        x: points.reduce((sum, p) => sum + p.x, 0) /
          points.length,
        y: points.reduce((sum, p) => sum + p.y, 0) /
          points.length
      };
    }

    // เรียงมุมของกรอบเพื่อให้ได้ TL, TR, BR, BL
    function orderQuad(points) {
      const center = centerOf(points);

      const sorted = points.slice().sort((a, b) =>
        Math.atan2(a.y - center.y, a.x - center.x) -
        Math.atan2(b.y - center.y, b.x - center.x)
      );

      let start = 0;
      let minSum = Infinity;

      sorted.forEach((p, i) => {
        const sum = p.x + p.y;

        if (sum < minSum) {
          minSum = sum;
          start = i;
        }
      });

      let ordered = sorted
        .slice(start)
        .concat(sorted.slice(0, start));

      const cross =
        (ordered[1].x - ordered[0].x) *
        (ordered[2].y - ordered[1].y) -
        (ordered[1].y - ordered[0].y) *
        (ordered[2].x - ordered[1].x);

      if (cross < 0) {
        ordered = [
          ordered[0],
          ordered[3],
          ordered[2],
          ordered[1]
        ];
      }

      if (ordered[1].x < ordered[3].x) {
        ordered = [
          ordered[0],
          ordered[3],
          ordered[2],
          ordered[1]
        ];
      }

      return ordered;
    }

    // ตรวจหารูปสี่เหลี่ยมจากภาพกล้อง
    function extractCandidates(srcMat, width, height) {
      const candidates = [];

      let gray = new cv.Mat();
      let blurred = new cv.Mat();
      let edges = new cv.Mat();
      let closed = new cv.Mat();
      let contours = new cv.MatVector();
      let hierarchy = new cv.Mat();
      let kernel = null;

      try {
        cv.cvtColor(srcMat, gray, cv.COLOR_RGBA2GRAY);

        cv.GaussianBlur(
          gray,
          blurred,
          new cv.Size(7, 7),
          0
        );

        // ลด threshold เพื่อช่วยตรวจจับขอบที่ไม่ชัด
        cv.Canny(blurred, edges, 25, 110);

        // เชื่อมช่องว่างเล็ก ๆ ของเส้นขอบให้มากขึ้น
        kernel = cv.getStructuringElement(
          cv.MORPH_RECT,
          new cv.Size(7, 7)
        );

        cv.morphologyEx(
          edges,
          closed,
          cv.MORPH_CLOSE,
          kernel
        );

        cv.findContours(
          closed,
          contours,
          hierarchy,
          cv.RETR_LIST,
          cv.CHAIN_APPROX_SIMPLE
        );

        const imageArea = width * height;

        for (let i = 0; i < contours.size(); i++) {
          const contour = contours.get(i);
          const approx = new cv.Mat();

          try {
            const area = Math.abs(
              cv.contourArea(contour)
            );

            const ratio = area / imageArea;

            if (
              ratio < MIN_AREA_RATIO ||
              ratio > MAX_AREA_RATIO
            ) {
              continue;
            }

            const perimeter = cv.arcLength(contour, true);

            cv.approxPolyDP(
              contour,
              approx,
              0.03 * perimeter,
              true
            );

            if (
              approx.rows !== 4 ||
              !cv.isContourConvex(approx)
            ) {
              continue;
            }

            const points = [];

            for (let j = 0; j < 4; j++) {
              const ptr = approx.intPtr(j, 0);

              points.push({
                x: ptr[0],
                y: ptr[1]
              });
            }

            const ordered = orderQuad(points);
            const areaQuad = polygonArea(ordered);

            if (areaQuad < 0.008 * imageArea) {
              continue;
            }

            const xs = ordered.map(p => p.x);
            const ys = ordered.map(p => p.y);

            const boxW =
              Math.max(...xs) - Math.min(...xs);

            const boxH =
              Math.max(...ys) - Math.min(...ys);

            if (
              boxW < width * 0.12 ||
              boxH < height * 0.07
            ) {
              continue;
            }

            const ratioWH = boxW / Math.max(boxH, 1);

            if (ratioWH < 0.75 || ratioWH > 5.5) {
              continue;
            }

            const center = centerOf(ordered);

            candidates.push({
              points: ordered,
              area: areaQuad,
              center
            });
          } finally {
            approx.delete();
            contour.delete();
          }
        }
      } finally {
        gray.delete();
        blurred.delete();
        edges.delete();
        closed.delete();
        contours.delete();
        hierarchy.delete();

        if (kernel) kernel.delete();
      }

      return candidates;
    }

    // เลือกกรอบที่แตะหนึ่งครั้ง แล้วติดตามเฉพาะกรอบนั้นจนรีเฟรชเว็บ
    function chooseCandidate(candidates) {
      // ยังไม่ได้ล็อก: รอให้แตะภายในกรอบที่ตรวจพบ
      if (!targetLocked) {
        if (!selectedPoint || !candidates.length) return null;

        const tapped = candidates
          .filter(c => polygonContainsPoint(selectedPoint, c.points))
          .sort((a, b) => b.area - a.area)[0];

        if (!tapped) return null;

        targetLocked = true;
        selectedQuad = tapped.points.map(p => ({ ...p }));
        previousQuadCenter = { ...tapped.center };
        selectedPoint = null;
        lostFrames = 0;

        status.textContent =
          "ล็อกกรอบที่เลือกแล้ว จะไม่เปลี่ยนกรอบจนกว่าจะรีเฟรชเว็บ";

        return tapped;
      }

      // ล็อกแล้ว: ไม่เลือกกรอบอื่น แม้กรอบเดิมจะหายไปชั่วคราว
      if (!selectedQuad || !previousQuadCenter || !candidates.length) {
        return null;
      }

      const frameDiagonal = Math.hypot(
        canvasOutput.width,
        canvasOutput.height
      );

      const previousArea = Math.max(
        polygonArea(selectedQuad),
        1
      );

      // เลือกผู้สมัครที่ใกล้ตำแหน่งเดิม และมีขนาด/รูปทรงใกล้เคียงกัน
      const matches = candidates.map(c => {
        const centerDistance = Math.hypot(
          c.center.x - previousQuadCenter.x,
          c.center.y - previousQuadCenter.y
        );

        const areaRatio = Math.max(c.area, 1) / previousArea;
        const areaPenalty = Math.abs(Math.log(areaRatio));

        let cornerDistance = 0;

        for (let i = 0; i < 4; i++) {
          cornerDistance += Math.hypot(
            c.points[i].x - selectedQuad[i].x,
            c.points[i].y - selectedQuad[i].y
          );
        }

        cornerDistance /= 4;

        const score =
          (centerDistance / frameDiagonal) +
          (cornerDistance / frameDiagonal) * 0.25 +
          areaPenalty * 0.035;

        return {
          candidate: c,
          centerDistance,
          areaRatio,
          score
        };
      }).filter(item =>
        item.centerDistance <= frameDiagonal * 0.30 &&
        item.areaRatio >= 0.15 &&
        item.areaRatio <= 6.5
      ).sort((a, b) => a.score - b.score);

      return matches.length ? matches[0].candidate : null;
    }

    // คำนวณพิกัดจุดกลางภาพในกรอบที่เลือก
    // คงวิธีคำนวณ Perspective Transform และแกน X/Y เดิม
    function calculateNormalizedXY(quad, width, height) {
      let source = null;
      let destination = null;
      let transform = null;
      let centerPoint = null;
      let result = null;

      try {
        source = cv.matFromArray(
          4, 1, cv.CV_32FC2,
          quad.flatMap(p => [p.x, p.y])
        );

        destination = cv.matFromArray(
          4, 1, cv.CV_32FC2,
          [0, 0, 1, 0, 1, 1, 0, 1]
        );

        transform = cv.getPerspectiveTransform(
          source,
          destination
        );

        centerPoint = cv.matFromArray(
          1, 1, cv.CV_32FC2,
          [width / 2, height / 2]
        );

        result = new cv.Mat();

        cv.perspectiveTransform(
          centerPoint,
          result,
          transform
        );

        const rawX = result.data32F[0];
        const rawY = result.data32F[1];

        if (
          !Number.isFinite(rawX) ||
          !Number.isFinite(rawY)
        ) {
          return lastGoodXY;
        }

        const x = Math.max(0, Math.min(1, rawX));
        const y = Math.max(0, Math.min(1, rawY));

        // Exponential smoothing ลดการสั่นของ X/Y
        if (!smoothedXY) {
          smoothedXY = { x, y };
        } else {
          let dx = x - smoothedXY.x;
          let dy = y - smoothedXY.y;

          // ตัดการเปลี่ยนแปลงจิ๋ว ๆ จาก noise ของกล้อง
          if (Math.abs(dx) < XY_DEADBAND) dx = 0;
          if (Math.abs(dy) < XY_DEADBAND) dy = 0;

          smoothedXY = {
            x: Math.max(0, Math.min(1,
              smoothedXY.x + dx * XY_SMOOTHING_ALPHA)),
            y: Math.max(0, Math.min(1,
              smoothedXY.y + dy * XY_SMOOTHING_ALPHA))
          };
        }

        lastGoodXY = { ...smoothedXY };
        return lastGoodXY;
      } catch (error) {
        console.error("คำนวณพิกัดไม่สำเร็จ:", error);
        return lastGoodXY;
      } finally {
        [
          source,
          destination,
          transform,
          centerPoint,
          result
        ].forEach(mat => {
          if (mat) mat.delete();
        });
      }
    }

    function processVideo() {
      if (!isProcessing) return;

      if (!camera.videoWidth || !camera.videoHeight) {
        requestAnimationFrame(processVideo);
        return;
      }

      const width = camera.videoWidth;
      const height = camera.videoHeight;

      if (
        canvasOutput.width !== width ||
        canvasOutput.height !== height
      ) {
        canvasOutput.width = width;
        canvasOutput.height = height;
      }

      ctx.drawImage(camera, 0, 0, width, height);

      let srcMat = null;

      try {
        srcMat = cv.imread(canvasOutput);

        const candidates = extractCandidates(
          srcMat,
          width,
          height
        );

        const chosen = chooseCandidate(candidates);

        if (chosen) {
          selectedQuad = chosen.points.map(p => ({
            x: p.x,
            y: p.y
          }));

          previousQuadCenter = { ...chosen.center };
          lostFrames = 0;

          const xy = calculateNormalizedXY(
            selectedQuad,
            width,
            height
          );

          displayCoordinates(xy.x, xy.y, true);

          // ส่งพิกัด X/Y ที่คำนวณได้ไป Node.js → OSC → TouchDesigner
          sendXYToTouchDesigner(xy.x, xy.y);

          status.textContent =
            "สถานะ: ตรวจพบและติดตามกรอบที่ล็อกไว้แล้ว";

          // เมื่อเลือกแล้ว ซ่อนกรอบอื่นทั้งหมด
          drawFrameOverlays(
            srcMat,
            targetLocked ? [] : candidates,
            selectedQuad
          );
        } else if (targetLocked && selectedQuad) {
          // ถ้าหากกรอบหาย ให้เก็บตำแหน่งล่าสุดไว้
          // และค้นหากรอบเดิมต่อไปโดยไม่ปลดล็อก
          lostFrames++;

          drawOpenCvPolygon(
            srcMat,
            selectedQuad,
            "#0bf4ec",
            3
          );

          displayCoordinates(
            lastGoodXY.x,
            lastGoodXY.y,
            true
          );

          status.textContent =
            `สถานะ: กรอบถูกล็อกไว้ กำลังค้นหากรอบเดิมอีกครั้ง (${lostFrames} เฟรม)`;

          drawFrameOverlays(
            srcMat,
            [],
            selectedQuad
          );
        } else {
          lostFrames++;

          displayCoordinates(0, 0, false);

          status.textContent = selectedPoint
            ? "สถานะ: แตะภายในกรอบที่ต้องการเลือก"
            : targetLocked
              ? "สถานะ: ล็อกเป้าหมายแล้ว แต่ยังไม่พบกรอบเดิม กำลังรอติดตามต่อ"
              : "สถานะ: กำลังค้นหารูปทรงสี่เหลี่ยม...";

          drawFrameOverlays(
            srcMat,
            candidates,
            null
          );
        }

        cv.imshow(canvasOutput, srcMat);
      } catch (error) {
        console.error("OpenCV error:", error);

        status.textContent =
          "เกิดข้อผิดพลาดในการตรวจจับ ดูรายละเอียดใน Console";
      } finally {
        if (srcMat) srcMat.delete();
      }

      requestAnimationFrame(processVideo);
    }

    // วาดกรอบตามมุมจริงทั้งสี่มุม
    function drawOpenCvPolygon(
      mat,
      points,
      color,
      thickness
    ) {
      const cvColor =
        color === "#0bf4ec"
          ? new cv.Scalar(11, 244, 236, 255)
          : new cv.Scalar(255, 180, 0, 255);

      for (let i = 0; i < points.length; i++) {
        const a = points[i];
        const b = points[(i + 1) % points.length];

        cv.line(
          mat,
          new cv.Point(
            Math.round(a.x),
            Math.round(a.y)
          ),
          new cv.Point(
            Math.round(b.x),
            Math.round(b.y)
          ),
          cvColor,
          thickness
        );

        cv.circle(
          mat,
          new cv.Point(
            Math.round(a.x),
            Math.round(a.y)
          ),
          6,
          cvColor,
          -1
        );
      }
    }

    // วาดกรอบที่ตรวจพบ
    function drawFrameOverlays(
      mat,
      candidates,
      chosenPoints
    ) {
      candidates.forEach(c => {
        if (
          chosenPoints &&
          c.points.every((p, i) =>
            Math.hypot(
              p.x - chosenPoints[i].x,
              p.y - chosenPoints[i].y
            ) < 3
          )
        ) {
          return;
        }

        drawOpenCvPolygon(
          mat,
          c.points,
          "orange",
          2
        );
      });

      if (chosenPoints) {
        drawOpenCvPolygon(
          mat,
          chosenPoints,
          "#0bf4ec",
          4
        );
      }
    }

    // เปิด/ปิดกล้องและส่งสถานะ Active/Inactive
    button.addEventListener("click", async () => {
      if (!isOpenCvReady) return;

      if (stream) {
        isProcessing = false;
        sendPlayerActive(false);

        stream.getTracks().forEach(track => track.stop());

        stream = null;
        camera.srcObject = null;

        // ปิดกล้องได้ แต่คงล็อกเป้าหมายไว้จนกว่าจะรีเฟรชเว็บ
        displayCoordinates(
          lastGoodXY.x,
          lastGoodXY.y,
          targetLocked
        );

        ctx.clearRect(
          0,
          0,
          canvasOutput.width,
          canvasOutput.height
        );

        button.textContent = "เปิดกล้องส่องหา";
        status.textContent = "สถานะ: ปิดกล้องแล้ว";

        return;
      }

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "เบราว์เซอร์ไม่รองรับกล้อง กรุณาเปิดผ่าน HTTPS หรือ localhost"
          );
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        camera.srcObject = stream;

        await camera.play();

        isProcessing = true;
        sendPlayerActive(true);

        button.textContent = "ปิดกล้อง";

        status.textContent = targetLocked
          ? "สถานะ: กล้องทำงานแล้ว กำลังติดตามกรอบที่ล็อกไว้"
          : "สถานะ: กล้องทำงานแล้ว แตะภายในกรอบเพื่อเลือกเป้าหมาย";

        requestAnimationFrame(processVideo);
      } catch (error) {
        status.textContent =
          "เปิดกล้องไม่สำเร็จ: " + error.message;

        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }

        stream = null;
        isProcessing = false;
        sendPlayerActive(false);
      }
    });

    window.addEventListener("pagehide", () => {
      sendPlayerActive(false);
      if (stream) stream.getTracks().forEach(track => track.stop());
      if (socket) socket.close();
    });

    // ตรวจสอบว่า OpenCV พร้อมทำงานหรือยัง
    window.addEventListener("load", () => {
      if (
        typeof cv !== "undefined" &&
        cv.Mat &&
        !isOpenCvReady
      ) {
        onOpenCvReady();
      }
    });
  </script>
</body>
</html>
